<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ album.name }} | EasyAlbumViewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
</head>
<body class="slideshow-body">
  <header class="topbar">
    <a class="wordmark" href="{{ url_for('index') }}"><span class="brand-mark">E</span> EasyAlbumViewer</a>
    <a class="nav-link" href="{{ url_for('index') }}">All albums</a>
  </header>
  <main class="viewer-shell" data-photos='{{ photo_urls|tojson }}'>
    <aside class="album-drawer" aria-label="Album navigation">
      <button class="album-drawer-toggle" type="button" aria-label="Open album menu" aria-expanded="false" aria-controls="album-menu">☰</button>
      <div class="album-drawer-panel" id="album-menu">
        <div class="album-drawer-heading">
          <h2>Albums</h2>
          <button class="album-drawer-lock" type="button" aria-label="Lock album menu open" aria-pressed="false">Lock</button>
        </div>
        <nav class="album-drawer-list" aria-label="Albums">
          {% for item in albums %}
            <a class="album-drawer-link{% if item.name == album.name and item.library == album.library %} active{% endif %}"
               href="{{ url_for('slideshow', album_name=item.name, library=item.library) }}"
               {% if item.name == album.name and item.library == album.library %}aria-current="page"{% endif %}>
              <span>{{ item.name }}</span>
              <small>Library {{ item.library + 1 }}</small>
            </a>
          {% endfor %}
        </nav>
      </div>
    </aside>
    <div class="viewer-heading"><div><p class="eyebrow">NOW VIEWING</p><h1>{{ album.name }}</h1></div><p class="viewer-count">{{ album.count }} photos</p></div>
    <div class="viewer-toolbar">
      <div class="fit-switch" role="group" aria-label="Photo display mode">
        <button class="fit-button" type="button" data-fit="contain" aria-pressed="true">Fit</button>
        <button class="fit-button" type="button" data-fit="cover" aria-pressed="false">Fill</button>
      </div>
      <div class="zoom-controls" role="group" aria-label="Photo zoom">
        <button class="zoom-button" type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out">−</button>
        <span class="zoom-level" aria-live="polite">300%</span>
        <button class="zoom-button" type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in" disabled>+</button>
      </div>
      <label class="interval-control" for="slide-interval"><span>Switch every</span>
        <select id="slide-interval" aria-label="Slideshow interval">
          <option value="3">3 sec</option>
          <option value="5" selected>5 sec</option>
          <option value="8">8 sec</option>
          <option value="10">10 sec</option>
          <option value="15">15 sec</option>
          <option value="30">30 sec</option>
        </select>
      </label>
    </div>
    <section class="photo-stage" aria-label="Slideshow">
      <div class="photo-scroll-content">
        <img class="slide-image" src="{{ photo_urls[0] }}" alt="Photo 1 of {{ album.count }}">
      </div>
      <div class="photo-shade"></div>
      <div class="photo-caption"><span class="photo-number">01</span><span class="caption-divider"></span><span class="photo-total">{{ "%02d"|format(album.count) }}</span></div>
    </section>
    <div class="viewer-controls">
      <div class="slide-status"><span class="status-dot"></span><span class="status-text">Playing</span></div>
      <div class="control-group">
        <button class="control-button" type="button" data-action="previous" aria-label="Previous photo" title="Previous photo">←</button>
        <button class="control-button pause-button" type="button" data-action="toggle" aria-label="Pause slideshow" title="Pause slideshow">Ⅱ</button>
        <button class="control-button" type="button" data-action="next" aria-label="Next photo" title="Next photo">→</button>
        <button class="control-button fullscreen-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
      </div>
      <span class="sequence-label"><span class="current-index">1</span> / {{ album.count }}</span>
    </div>
    <nav class="photo-filmstrip" aria-label="Photos in this album">
      {% for photo_url in photo_urls %}
        <button class="filmstrip-photo{% if loop.first %} active{% endif %}" type="button" data-photo-index="{{ loop.index0 }}"
                aria-label="Show photo {{ loop.index }} of {{ album.count }}"
                aria-pressed="{{ 'true' if loop.first else 'false' }}">
          <img src="{{ photo_url }}" alt="" loading="lazy">
        </button>
      {% endfor %}
    </nav>
  </main>
  <script src="{{ asset_url('slideshow.js') }}" defer></script>
</body>
</html>
